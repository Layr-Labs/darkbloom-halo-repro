#!/usr/sbin/nft -f
# Direct-LAN TLS coordinator; no Tailscale, SSH, engine or debug listener exposed.
flush ruleset
table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept
        udp dport { 68, 546 } accept
    }
    chain forward { type filter hook forward priority filter; policy drop; }
    chain output {
        type filter hook output priority filter; policy accept;
        # Keep engine confinement independent of systemd's BPF support.
        meta skuid "dbengine" ip daddr 127.0.0.0/8 accept
        meta skuid "dbengine" ip6 daddr ::1 accept
        meta skuid "dbengine" reject with icmpx type admin-prohibited
    }
}
